name: Publish the site (static export)

# GitHub Pages for this repository is configured as a "legacy" deployment that
# serves the root of `main`. The Next.js application lives in `krafter/`, so this
# workflow rebuilds its static export and commits the result to the root — the
# published artefact is always generated from the source, never edited by hand.

on:
  push:
    branches: ["main"]
    paths:
      - "krafter/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "publish-static-site"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: krafter/package-lock.json

      - name: Install dependencies
        working-directory: krafter
        run: npm ci

      - name: Build and publish the export to the repository root
        working-directory: krafter
        run: npm run publish:pages

      - name: Commit the generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html 404.html _next images projects brand \
            a-propos services projets competences blog contact \
            sitemap.xml robots.txt favicon.svg og.jpg .nojekyll
          if git diff --cached --quiet; then
            echo "Artefact déjà à jour."
          else
            git commit -m "chore(pages): rebuild the static site from krafter/"
            git push
          fi
