<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 - Page introuvable | Rosaire KAKPO</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
[data-theme="dark"]{--bg:#06080C;--text:#EEF2FF;--orange:#A020F0}
[data-theme="light"]{--bg:#F5F3EF;--text:#0F1623;--orange:#8000CC}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{text-align:center;max-width:600px}
.error-code{font-family:'Clash Display',sans-serif;font-size:clamp(80px,15vw,180px);font-weight:700;color:var(--orange);line-height:1;letter-spacing:-5px;margin-bottom:20px}
.error-title{font-family:'Clash Display',sans-serif;font-size:clamp(28px,5vw,48px);font-weight:700;letter-spacing:-2px;margin-bottom:16px}
.error-desc{font-size:16px;color:var(--text);opacity:.7;line-height:1.6;margin-bottom:40px}
.btn-p{background:var(--orange);color:#fff;padding:16px 32px;border-radius:8px;font-size:15px;font-weight:500;text-decoration:none;display:inline-block;transition:all .3s}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(160,32,240,.3)}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;opacity:.8}
.glitch::before{animation:glitch1 2s infinite;clip-path:polygon(0 0,100% 0,100% 45%,0 45%);color:#ff00ff}
.glitch::after{animation:glitch2 3s infinite;clip-path:polygon(0 55%,100% 55%,100% 100%,0 100%);color:#00ffff}
@keyframes glitch1{0%,100%{transform:translate(0)}20%{transform:translate(-5px,5px)}40%{transform:translate(-5px,-5px)}60%{transform:translate(5px,5px)}80%{transform:translate(5px,-5px)}}
@keyframes glitch2{0%,100%{transform:translate(0)}20%{transform:translate(5px,5px)}40%{transform:translate(5px,-5px)}60%{transform:translate(-5px,5px)}80%{transform:translate(-5px,-5px)}}
</style>
</head>
<body>
<div class="container">
  <div class="error-code"><span class="glitch" data-text="404">404</span></div>
  <h1 class="error-title">Page introuvable</h1>
  <p class="error-desc">Désolé, la page que vous recherchez semble avoir disparu dans le cyberespace. Retournons à la base.</p>
  <a href="index.html" class="btn-p">← Retour à l'accueil</a>
</div>
</body>
</html>
